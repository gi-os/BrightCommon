name: Check

# Runs on every branch including main, unlike the apps' version of this file. There the
# default branch is excluded because a push to it publishes an APK, so main is checked by
# the release build itself. Here publishing is tag-gated, so main would otherwise never be
# compiled at all — and main is the branch consumers are told to trust.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :lib:testReleaseUnitTest --stacktrace
      - name: Assemble
        run: ./gradlew :lib:assembleRelease --stacktrace
