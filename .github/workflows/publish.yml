name: Publish

# Tag-driven, not push-driven. The apps release on every push to their default branch because
# the APK is the only artifact anyone wants; a library is the opposite — consumers pin a version,
# so publishing has to be a deliberate act with a number attached to it.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The tag must match `libraryVersion` in lib/build.gradle.kts. The job checks that rather than
# trusting it, because a version mismatch is silent and permanent: Maven artifacts are immutable,
# so a wrong number cannot be republished, only superseded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # contents: write, not read — the last step creates the GitHub release, and a release is
  # a write to repository contents. packages: write is for the Maven artifact itself.
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Tag must match libraryVersion
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DECLARED=$(grep -oE 'val libraryVersion = "[^"]+"' lib/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG declared=$DECLARED"
          [ "$TAG" = "$DECLARED" ] || {
            echo "::error::tag $TAG does not match libraryVersion $DECLARED in lib/build.gradle.kts"
            exit 1
          }

      - name: Unit tests
        run: ./gradlew :lib:testReleaseUnitTest --stacktrace

      - name: Publish to GitHub Packages
        run: ./gradlew :lib:publishReleasePublicationToGitHubPackagesRepository --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: light-common ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
